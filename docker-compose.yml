services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"         # Reverse proxy maps portfolio.emperordanivn.com → :3000
    environment:
      - NODE_ENV=production
      # EmailJS (optional — source has fallback defaults; set here to override for production)
      # - NEXT_PUBLIC_EMAILJS_SERVICE_ID=service_xxxxxxx
      # - NEXT_PUBLIC_EMAILJS_TEMPLATE_ID=template_xxxxxxx
      # - NEXT_PUBLIC_EMAILJS_PUBLIC_KEY=xxxxxxxxxxxxxxxxxxxx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
